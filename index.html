<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة صحة - استعلام عن إجازة مرضية</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef2f7; text-align: center; padding: 20px; direction: rtl; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 400px; }
        h2 { color: #0056b3; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 25px; padding: 15px; border-radius: 8px; font-size: 18px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="container">
        <h2>منصة صحة</h2>
        <p>استعلم عن بيانات الإجازة المرضية</p>
        <input type="number" id="natId" placeholder="أدخل رقم الهوية">
        <input type="number" id="leaveId" placeholder="أدخل رمز الإجازة">
        <button onclick="checkData()">استعلام الآن</button>
        <div id="result"></div>
    </div>

    <script>
        async function checkData() {
            const natId = document.getElementById('natId').value;
            const leaveId = document.getElementById('leaveId').value;
            const resDiv = document.getElementById('result');

            if (!natId || !leaveId) {
                showResult("يرجى إدخال كافة البيانات", "error");
                return;
            }

            resDiv.style.display = "block";
            resDiv.innerHTML = "جاري البحث عن البيانات...";
            resDiv.className = "";

            // رابط الجدول الخاص بك بصيغة JSON
            const sheetId = "1dJbaxOKHle4CiZIu0xVjaNJw2JgE5YZrpustJCcQ0dg";
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

            try {
                const response = await fetch(url);
                const text = await response.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));
                const rows = json.table.rows;

                let foundRow = rows.find(row => 
                    row.c[0] && row.c[0].v.toString() === leaveId && 
                    row.c[1] && row.c[1].v.toString() === natId
                );

                if (foundRow) {
                    const name = foundRow.c[2] ? foundRow.c[2].v : "غير مسجل";
                    showResult(`تم العثور على الإجازة باسم:<br><strong>${name}</strong>`, "success");
                } else {
                    showResult("عذراً، البيانات المدخلة غير صحيحة أو غير موجودة.", "error");
                }
            } catch (error) {
                showResult("حدث خطأ في الاتصال بالبيانات. تأكد من نشر الجدول للويب.", "error");
            }
        }

        function showResult(message, type) {
            const resDiv = document.getElementById('result');
            resDiv.style.display = "block";
            resDiv.className = type;
            resDiv.innerHTML = message;
        }
    </script>
</body>
</html>
                <button onclick="searchInSheets()" id="searchBtn" class="w-full bg-[#3267b2] text-white p-4 rounded-xl font-bold text-lg hover:bg-blue-800 transition-all">استعلام</button>
                <p id="errorMsg" class="text-red-500 text-sm hidden">عذراً، لم يتم العثور على بيانات مطابقة.</p>
            </div>
        </main>
    </div>

    <div id="reportPage" class="page-section">
        <div class="no-print p-4 bg-slate-800 text-white flex justify-between">
            <button onclick="location.reload()" class="bg-slate-600 px-4 py-1 rounded">بحث جديد</button>
            <button onclick="window.print()" class="bg-green-600 px-4 py-1 rounded">طباعة التقرير</button>
        </div>

        <div id="printablePage">
            <table class="seha-table">
                <tr><td>رمز الإجازة</td><td colspan="2" id="resLeaveID" class="font-mono"></td><td>Leave ID</td></tr>
                <tr class="bg-navy"><td>مدة الإجازة</td><td id="resDurAr"></td><td id="resDurEn" class="font-mono text-[10px]"></td><td>Duration</td></tr>
                <tr><td>الاسم</td><td id="resNameAr"></td><td id="resNameEn" class="font-mono text-[10px]"></td><td>Name</td></tr>
                <tr class="bg-gray-100"><td>رقم الهوية</td><td colspan="2" id="resNationalID" class="text-lg"></td><td>ID Number</td></tr>
                <tr><td>الطبيب المعالج</td><td colspan="2" id="resDoctor"></td><td>Physician</td></tr>
            </table>

            <div class="absolute bottom-[25mm] left-[15mm] w-[45%] flex flex-col items-center">
                <img id="resQR" class="w-32 mb-2">
                <span class="text-[10px] font-bold">يرجى التأكد من زيارة موقع منصة صحة الرسمي للتحقق</span>
                <span class="text-[9px] underline text-blue-900 mt-2 italic">www.seha.sa/#inquiries/slenquiry</span>
            </div>
        </div>
    </div>

    <script>
        // رابط الجدول الخاص بك (بصيغة CSV للقراءة)
        const sheetURL = "https://cors-anywhere.herokuapp.com/https://docs.google.com/spreadsheets/d/1dJbaxOKHle4CiZIu0xVjaNJw2JgE5YZrpustJCcQ0dg/gviz/tq?tqx=out:csv";


        async function searchInSheets() {
            const lID = document.getElementById('inputLeaveID').value.trim();
            const nID = document.getElementById('inputNationalID').value.trim();
            const btn = document.getElementById('searchBtn');
            const error = document.getElementById('errorMsg');

            if(!lID || !nID) { alert("يرجى إدخال كافة البيانات"); return; }

            btn.innerText = "جاري البحث...";
            btn.disabled = true;
            error.classList.add('hidden');

            try {
                const response = await fetch(sheetURL);
                const data = await response.text();
                // تحويل البيانات من نص إلى مصفوفة
                const rows = data.split('\n').map(row => row.split(',').map(cell => cell.replace(/"/g, '')));

                // البحث عن الصف المطابق (LeaveID في العمود A و NationalID في العمود B)
                const found = rows.find(r => r[0] === lID && r[1] === nID);

                if (found) {
                    // تعبئة البيانات في التقرير
                    document.getElementById('resLeaveID').innerText = found[0];
                    document.getElementById('resNationalID').innerText = found[1];
                    document.getElementById('resNameAr').innerText = found[2];
                    document.getElementById('resNameEn').innerText = found[3];
                    document.getElementById('resDurAr').innerText = found[4];
                    document.getElementById('resDurEn').innerText = found[5];
                    document.getElementById('resDoctor').innerText = found[6];
                    
                    // توليد الباركود
                    document.getElementById('resQR').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('SL_'+found[0])}`;

                    // الانتقال لصفحة التقرير
                    document.getElementById('searchPage').classList.remove('active');
                    document.getElementById('reportPage').classList.add('active');
                } else {
                    error.classList.remove('hidden');
                }
            } catch (e) {
                alert("حدث خطأ في الاتصال بقاعدة البيانات");
            } finally {
                btn.innerText = "استعلام";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
